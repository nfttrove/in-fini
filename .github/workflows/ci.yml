name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: bundle sanity (new UI actually shipped)
        run: |
          BUNDLE=$(ls dist/assets/index-*.js)
          for m in "Claim Registry" "Experiment Design" "Data Lab" "Replication Network" "Circuit QED"; do
            grep -q "$m" "$BUNDLE" || { echo "MISSING FROM BUNDLE: $m"; exit 1; }
          done
